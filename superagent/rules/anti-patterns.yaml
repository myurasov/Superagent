# [Do not change manually — managed by Superagent]
#
# Skill anti-pattern catalogue. The scanner (`tools/anti_patterns.py`) reads
# this file at import time. Each row is a regex-based heuristic that flags a
# specific waste pattern in skill markdown files.
#
# Schema:
#   schema_version: int
#   last_updated:   iso datetime | null
#   rules:
#     - id:          str   ("AP-N" — stable; never reused)
#       severity:    "warning" | "info"
#       description: str   (human-readable; what the pattern catches)
#       pattern:     str   (Python re.compile source — single-quoted in YAML)
#       flags:       list  (subset of: IGNORECASE, DOTALL, MULTILINE)
#       mitigation:  str   (what the skill author should do instead)
#
# Adding a new pattern:
#   1. Append a row with the next AP-N id (do not renumber existing rows).
#   2. Test the regex against representative skill markdown.
#   3. Add a row to contracts/anti-patterns.md catalogue table referencing this file.
#   4. Bump `last_updated`.
#
# Users may add their own anti-patterns at workspace/_custom/rules/anti-patterns.yaml
# (same schema). The scanner concatenates framework + user lists, in that order.
schema_version: 1
last_updated: "2026-08-21"
rules:
  - id: AP-1
    severity: warning
    description: "Blanket 4-file read (info + status + history + rolodex)."
    pattern: '\b(?:read|load|open)\b[^.]*\binfo(?:\.md)?\b[^.]*\bstatus(?:\.md)?\b[^.]*\bhistory(?:\.md)?\b[^.]*\brolodex(?:\.md)?\b'
    flags: [IGNORECASE, DOTALL]
    mitigation: "Specify which sections to read: 'read info.md § Profile + status.md § Current Status; pull history.md only if needed'."

  - id: AP-2
    severity: warning
    description: "Unfiltered 'all open tasks' read."
    pattern: '\ball (?:open|active) tasks\b(?![^.]*(?:related_domain|related_project|related_asset|--domain|--project|--asset|filter|scope))'
    flags: [IGNORECASE, DOTALL]
    mitigation: "Always include the filter: 'tasks where related_domain == X' or '--project Y'."

  - id: AP-3
    severity: info
    description: "Whole-workspace grep without scope."
    pattern: '\b(?:grep|search)\b[^.]*\b(?:across the (?:whole |entire )?workspace|every file)\b'
    flags: [IGNORECASE]
    mitigation: "Scope the grep to a specific Domain / Project folder."

  - id: AP-4
    severity: info
    description: "Sequential run-X-then-Y-then-Z that may be parallelizable."
    pattern: '\b(?:run|invoke|call)\b\s+\S+\s*[,;]\s*then\s+\S+\s*[,;]\s*then\s+\S+'
    flags: [IGNORECASE]
    mitigation: "Use a single tool-call message with all tool calls so they parallelize."

  - id: AP-5
    severity: info
    description: "Full email-thread pull without checking interaction-log first."
    pattern: '\b(?:pull|fetch|load|get)\b[^.]*\bfull (?:email )?thread\b(?![^.]*(?:interaction-log|local mirror|cache))'
    flags: [IGNORECASE, DOTALL]
    mitigation: "Consult the local interaction-log mirror or Sources cache first; only fetch the thread if the local copy is stale."

  - id: AP-6
    severity: info
    description: "RETIRED (0.8.0 — briefing-cache feature pruned). Id kept so AP-N numbering stays stable; pattern never matches."
    pattern: '(?!x)x'
    flags: []
    mitigation: "None — retired rule."

  - id: AP-7
    severity: warning
    description: "Unbounded read of a long doc (AGENTS.md or any contracts/* file)."
    pattern: '\b(?:read|load)\b[^.]*\b(?:whole|entire|all of|full)\b[^.]*\b(?:AGENTS\.md|contracts/[a-z0-9-]+\.md)\b'
    flags: [IGNORECASE, DOTALL]
    mitigation: "Use Grep first, then `Read --offset --limit` against the matching range. For AGENTS.md, read the file's table of contents only. For contracts/, each file is small enough that a full read is usually fine — but if you only need one section, target it with --offset / --limit."

  - id: AP-8
    severity: warning
    description: "Manifest-bypass: 'read every skill markdown' to discover a skill."
    pattern: '\bread (?:every|all) skill (?:markdown|file|md)\b'
    flags: [IGNORECASE]
    mitigation: "Read `skills/_manifest.yaml` first; load only the chosen skill's markdown."

  - id: AP-9
    severity: info
    description: "Load-then-extract: large file loaded, single fact extracted."
    pattern: '\b(?:load|read|open)\b[^.]*\b(?:full file|entire file|whole file)\b[^.]*\b(?:extract|find|locate|get)\s+(?:one|a single|the)\s+\w+\b'
    flags: [IGNORECASE, DOTALL]
    mitigation: "Use `Grep` (or, when available, the FTS5 search index) to extract just the matching lines."

  - id: AP-10
    severity: info
    description: "Entity-side payment-history append (bills/subscriptions) without a co-located accounts-index.yaml.<acct>.transactions[] mirror — see contracts/payment-confirmations.md § 4 step 3a."
    pattern: '\bappend(?:s|ed|ing)?\b[^.]*?\b(?:bills|subscriptions)\.yaml\.[^.]*?\.history\[\](?![\s\S]*?accounts-index\.yaml[\s\S]*?transactions)'
    flags: [IGNORECASE, DOTALL]
    mitigation: "Per contracts/payment-confirmations.md § 4 step 3a, every entity-side payment-history append must be paired with a symmetric `accounts-index.yaml.<account-id>.transactions[]` append in the same skill. If this skill already does both and the regex still fires, the lookahead failed to span the gap — annotate the section with a stronger cross-reference instead of restructuring."

  - id: AP-11
    severity: warning
    description: "Unsliced read of an unbounded-file-table store (todo.yaml, logs, signal stores, transactions, the email sidecar) — see rules/token-economy.md § Unbounded-file decision table. Lines citing live-todo / archive.find / find_by_query are exempt; dot-excluded gaps keep the match inside one clause (a dot means another filename or a sentence end intervenes)."
    pattern: '^(?![^\n]*(?:live-todo|archive\.find|find_by_query))[^\n]*?(?<!never )(?<!never `)(?<!not )(?<!n''t )(?<!avoid )(?<!avoid `)(?<!blindly )(?:\b(?:read|load|open|pull|fetch)\b[^.\n]{0,60}\b(?:whole|entire|in full|fully|full|complete(?:ly)?|all of|every (?:row|line|entry))\b[^.\n]{0,100}\b(?:todo\.yaml|interaction-log\.yaml|ingestion-log\.yaml|transactions\.yaml|action-signals\.yaml|personal-signals\.yaml|_messages\.jsonl|user-queries\.jsonl)|\b(?:read|load|open|pull|fetch)\b[^.\n]{0,100}\b(?:todo\.yaml|interaction-log\.yaml|ingestion-log\.yaml|transactions\.yaml|action-signals\.yaml|personal-signals\.yaml|_messages\.jsonl|user-queries\.jsonl)\b[^.\n]{0,60}\b(?:whole|entire|in full|fully|completely)\b|\bcat\b[^.\n]{0,80}\b(?:todo\.yaml|interaction-log\.yaml|ingestion-log\.yaml|transactions\.yaml|action-signals\.yaml|personal-signals\.yaml|_messages\.jsonl|user-queries\.jsonl)|\b(?:read|load|open|pull|fetch)\b[^.\n]{0,80}\b_messages\.jsonl\b)'
    flags: [IGNORECASE, MULTILINE]
    mitigation: "Slice, tail (negative offset), grep, or route through the canonical tool per the decision table in rules/token-economy.md. The live-todo write path (full todo.yaml read before writing todo.md) is exempt — cite rules/live-todo.md on the same line."

  - id: AP-12
    severity: info
    description: "Per-file sequential reads where one batched sweep is specified — see rules/token-economy.md § Always-on floor (Batching)."
    pattern: '(?<!never )(?<!never `)(?<!not )(?<!n''t )(?<!avoid )(?<!avoid `)(?<!blindly )(?:\b(?:read|open)\b[^.\n]{0,60}\b(?:one at a time|one by one|individually)\b|\bfor each\b[^.\n]{0,40}\b(?:file|domain|project|skill|entity)\b[^.\n]{0,40}\b(?:read|open)\b[^.\n]{0,40}\b(?:info\.md|status\.md|history\.md|the (?:whole|entire|full))\b)'
    flags: [IGNORECASE]
    mitigation: "A mechanical survey of 4+ files you will summarize (not edit) is one batched shell sweep (`head -40 f1 f2 ...`) or one parallel tool-call message — not N per-file reads."

  - id: AP-13
    severity: info
    description: "Whole-file read of a long file for a single fact (complements AP-9's 'full file' phrasing) — see rules/token-economy.md § Always-on floor (Read budget)."
    pattern: '(?<!never )(?<!never `)(?<!not )(?<!n''t )(?<!avoid )(?<!avoid `)(?<!blindly )\b(?:read|load|open)\b[^\n]{0,60}\b(?:whole|entire|in full)\b[^\n]{0,120}\b(?:to|and)\s+(?:find|check|confirm|verify|extract|get|locate)\b[^\n]{0,50}\b(?:one|a single|the)\b'
    flags: [IGNORECASE]
    mitigation: "Grep first to locate the relevant section, then `Read --offset --limit` against the matching range — whole-file reads are for known-small files or files whose full content the task genuinely needs."
