# [Do not change manually — managed by Superagent]
#
# Index of framework-shipped rule files under `superagent/rules/`.
#
# Each rule file is either:
#   - a YAML document carrying a list of named, machine-readable rules
#     (kind: yaml — the default; consumed by a scanner like
#     `tools/anti_patterns.py`); or
#   - a markdown policy doc that humans and agents read directly
#     (kind: doc — no machine consumer required).
#
# Rules differ from contracts (which live in `contracts/`): a rule is a single
# behavior the agent should follow or avoid; a contract is a multi-actor
# protocol that several components implement.
#
# Users may extend the rule set at `workspace/_custom/rules/<file>.{yaml,md}`
# using the same schema; loaders concatenate framework + user lists for
# machine-readable rules, and merge framework + user docs for policy files.
schema_version: 1
files:
  - path: anti-patterns.yaml
    kind: yaml
    purpose: "Skill-markdown anti-patterns that waste tokens or hide intent."
    consumed_by:
      - tools/anti_patterns.py
      - skills/supertailor-review.md
      - skills/doctor.md
    user_overlay: workspace/_custom/rules/anti-patterns.yaml
  - path: development-tooling.md
    kind: doc
    purpose: "Python venv, non-Python tool install location, temp-file path, and scope-discipline rules for the repository."
    consumed_by:
      - AGENTS.md
      - docs/architecture.md
    user_overlay: workspace/_custom/rules/development-tooling.md
  - path: file-naming.md
    kind: doc
    purpose: "No spaces in agent-created file or folder names; forward-only (pre-existing spaced paths not auto-renamed); allowed character set and slugification rules."
    consumed_by:
      - AGENTS.md
    user_overlay: workspace/_custom/rules/file-naming.md
  - path: image-format-policy.md
    kind: doc
    purpose: "No HEIC/HEIF under Sources/: convert to sRGB JPEG via the qlmanage->sips workaround at import time, then remove the HEIC. Acceptable formats + conversion helper at tools/heic_to_jpg.py."
    consumed_by:
      - AGENTS.md
      - tools/heic_to_jpg.py
    user_overlay: workspace/_custom/rules/image-format-policy.md
  - path: large-file-reads.md
    kind: doc
    purpose: "Never Read unbounded memory-resident files whole: per-file decision table (todo.yaml, email archive, logs, events stream, transactions) with allowed vs forbidden read forms, plus a generative rule for any new file."
    consumed_by:
      - AGENTS.md
    user_overlay: workspace/_custom/rules/large-file-reads.md
  - path: machine-local-home.md
    kind: doc
    purpose: "Machine-local root ~/.superagent/ ($SUPERAGENT_HOME): high-churn scratch (tmp/) and non-Python tool installs (tools/) live outside the iCloud-synced repo; helper at tools/home.py; sanctioned exception to scope discipline."
    consumed_by:
      - AGENTS.md
      - rules/development-tooling.md
      - tools/home.py
    user_overlay: workspace/_custom/rules/machine-local-home.md
  - path: memory-routing.md
    kind: doc
    purpose: "Memory-write specialization of scope-discipline: 'remember this' content goes ONLY to workspace/_memory (default) or workspace/_custom (or superagent/ on an explicit 'make it core' request); NEVER outside the repo root (e.g. ~/.claude/.../memory/MEMORY.md or a host-IDE memory store)."
    consumed_by:
      - AGENTS.md
      - rules/scope-discipline.md
    user_overlay: workspace/_custom/rules/memory-routing.md
  - path: scope-discipline.md
    kind: doc
    purpose: "Operationalizes the Knowledge discipline principle: 3-test gate (necessity / discovery-cost / speculation) the agent runs before every ask or fetch; verification ritual at task end."
    consumed_by:
      - AGENTS.md
      - superagent.agent.md
    user_overlay: workspace/_custom/rules/scope-discipline.md
  - path: subagent-bulk-reads.md
    kind: doc
    purpose: "Any lookup expected to pull >~20k tokens of raw tool results (and the session continues) runs in a subagent that returns only the synthesis; when-NOT-to-delegate list + cost/model tiering."
    consumed_by:
      - AGENTS.md
      - skills/daily-update.md
      - skills/weekly-review.md
      - skills/monthly-review.md
      - skills/research.md
      - skills/follow-up.md
      - skills/summarize-thread.md
      - skills/doctor.md
      - skills/supertailor-review.md
    user_overlay: workspace/_custom/rules/subagent-bulk-reads.md
  - path: tool-usage-corrections.md
    kind: doc
    purpose: "First-try tool-usage errors get their corrected form persisted into core docs in the same turn (AGENTS.md one-liner, then governing rule, then skill body, then tool --help), so no future session repeats the guess."
    consumed_by:
      - AGENTS.md
    user_overlay: workspace/_custom/rules/tool-usage-corrections.md
  - path: live-todo.md
    kind: doc
    purpose: "workspace/todo.md is the single live master todo view: update it in the same turn whenever any task changes; auto-close stale/done tasks with auto- prefix; always read todo.yaml in full before writing; count-reconcile open tasks to prevent omissions."
    consumed_by:
      - AGENTS.md
      - skills/todo.md
    user_overlay: workspace/_custom/rules/live-todo.md
  - path: markdown-formatting.md
    kind: doc
    purpose: "No --- horizontal rules; GFM checkboxes with bold-prefix numbering and backslash line breaks; 🚗/👤/🚗 👤 autonomy markers with non-breaking space."
    consumed_by:
      - AGENTS.md
    user_overlay: workspace/_custom/rules/markdown-formatting.md
  - path: task-ids.md
    kind: doc
    purpose: "Task display ID format: TASK-NNN (standalone) or TASK-NNN-X (subtasks A/B/C…); continuously numbered from oldest; no dates; never reassign. Next ID as of 2026-08-10: TASK-056."
    consumed_by:
      - AGENTS.md
      - rules/live-todo.md
    user_overlay: workspace/_custom/rules/task-ids.md
  - path: skill-discipline.md
    kind: doc
    purpose: "Skills must be read before any action is taken on a task they govern. Prohibits raw file ops that bypass skill protocols. Covers autoloaded skills, trigger-matched skills, and all capture/filing flows."
    consumed_by:
      - AGENTS.md
    user_overlay: workspace/_custom/rules/skill-discipline.md
