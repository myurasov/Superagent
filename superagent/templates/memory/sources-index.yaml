# [Do not change manually — managed by Superagent]
# Superagent memory: derived index of every entry under `Sources/`.
#
# This file is REBUILT FROM THE FILESYSTEM by `tools/sources_index.py refresh`
# whenever the agent reads it and the filesystem has changed. The filesystem
# under `Sources/` (and per-project `Projects/<slug>/Sources/`) is the source
# of truth; this index is a derived view.
#
# What persists across refreshes (preserved by id):
#   - notes, tags, sensitive
#   - related_domain, related_project, related_asset, related_account
#   - last_accessed, read_count
#   - any other user-set fields
#
# What gets recomputed:
#   - path, kind, category (heuristic from path), title (from filename if
#     not set in the document's `.meta.md` sidecar / the ref frontmatter),
#     present, watch
#
# Three things live under `Sources/` and reach this index:
#   - DOCUMENTS: any user file. Row kind `document`, keyed by the document's path.
#   - SIDECARS: `<doc>.<ext>.meta.md` next to a document carries its metadata
#     (title, related_*, tags, sensitive, notes). The sidecar has NO row of its
#     own — its frontmatter is folded into the document's row. A sidecar with
#     no document next to it is an "orphan" refresh warning, not a row.
#   - WATCHERS: `Sources/Watchlist/<Title_Case>.ref.md` (contracts/watchlist.md).
#     Row kind `watcher`, keyed by the ref path, with the `watch:` mapping lifted
#     into the row. Every `.ref.md` is a watcher; one outside the registry is a
#     "stray .ref.md outside the registry" refresh warning, not a row.
# README.md files, dotfiles and a leftover `_cache/` (retired 0.19.0 fetch
# cache) are excluded.

schema_version: 1
last_filesystem_scan: null    # ISO 8601 of the last `sources_index refresh` walk

sources:
  # Each source:
  #   id              — Stable slug. Default form `src-<sha1(workspace-relative-path)[:10]>`;
  #                      preserved across content moves by filename match (and kept when
  #                      a row's `path` is rewritten in place, e.g. by a migration).
  #   kind            — document | watcher
  #                      document → file at `path` is the source (metadata from an
  #                                 optional `<doc>.<ext>.meta.md` sidecar).
  #                      watcher  → `path` is a `Sources/Watchlist/<Title_Case>.ref.md`
  #                                 watcher definition; see `watch` below.
  #   title           — Display title (filename stem if not set in the sidecar / ref
  #                      frontmatter).
  #   path            — Workspace-relative path under Sources/.
  #   category        — Free-text tag (auto-derived from the first sub-folder under
  #                      Sources/; user-overridable). Drives nothing structural.
  #   related_domain  — Domain id from domains-index.yaml (optional).
  #   related_project — Project id from projects-index.yaml (optional).
  #   related_asset   — Asset id from assets-index.yaml (optional).
  #   related_account — Account id from accounts-index.yaml (optional).
  #   sensitive       — bool. If true, redacted from outbound surfaces.
  #   added           — ISO 8601 date when first indexed (preserved across refreshes).
  #   last_accessed   — ISO 8601 of last read by a skill or by the user.
  #   read_count      — How many times this source has been pulled into context.
  #   present         — bool. False means the file disappeared on last refresh; the
  #                      row is kept for one cycle in case the user wants to recover
  #                      its notes/cross-refs. Permanently dropped on next refresh
  #                      if still missing.
  #   normalized      — bool. Only meaningful for kind: watcher. True when the ref's
  #                      YAML frontmatter parsed on the last refresh; a transiently
  #                      broken file keeps its previously lifted `watch` mapping.
  #   tags            — Short labels.
  #   notes           — Free-form (where the physical original lives, why we keep it).
  #   watch           — kind: watcher only. The ref's `watch:` mapping (pack / type /
  #                      locator / cycles / ...), lifted verbatim as a derived view so
  #                      `sources list`, `search` and `tools/world.py` (`watch:<id>`
  #                      nodes) see watchers without opening the file. The ref stays
  #                      the source of truth; `tools/watchlist.py` never reads this.
  - id: ""
    kind: ""
    title: ""
    path: ""
    category: ""
    related_domain: null
    related_project: null
    related_asset: null
    related_account: null
    sensitive: false
    added: null
    last_accessed: null
    read_count: 0
    present: true
    normalized: false
    tags: []
    notes: ""
