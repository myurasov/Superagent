# [Do not change manually — managed by Superagent]
# Superagent memory: rolling "where we are right now" snapshot.
# Update frequently; this is the default handoff surface between sessions.
# Time-varying / bulky fields sit at the END (rules/token-economy.md floor).

schema_version: 1

# Date (YYYY-MM-DD) the on-open whatsup/daily-update suggestion was last made.
# Caps the stale-context nag at once per calendar day across session restarts.
refresh_suggested: null

# Per-domain "where we are" snapshots (auto-updated by daily-update).
# Each entry: { domain: "<slug>", note: "<one-line>", as_of: "<iso>" }
domain_snapshots: []

# Short bullet-like strings: items waiting on you (or on someone else).
pending_items: []

# Strings that need attention (deadlines, anomalies, unanswered messages).
# Resolved / superseded alerts are REMOVED — moved verbatim to
# _memory/alerts-archive.yaml — never annotated in place.
alerts: []

# One or two sentences: current top focus across all your domains.
current_focus: ""

# Free-text recap of the last few days (recent appointments, conversations, decisions, events).
# Keep only the newest ~8 entries; older ones move to _memory/alerts-archive.yaml.
recent_activity: ""

# Last time each cadence skill ran successfully (helps the Supertailor staleness pass).
last_runs:
  daily_update: null
  whatsup: null
  weekly_review: null
  monthly_review: null
  tailor_review: null
  doctor: null
  ingest_full: null   # most recent completed `ingest <source> --backfill` run

# When context was last refreshed (ISO 8601).
last_check: null
