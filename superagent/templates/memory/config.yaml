# [Do not change manually — managed by Superagent]
# Superagent memory: global configuration copied to workspace/_memory/
# on first init. Edit values to match your profile and preferences.

schema_version: 1

last_updated: null
# ISO 8601 datetime string when this file was last edited (e.g. "2026-04-28T01:00:00-07:00").

profile:
  # Who this workspace represents (you).
  name: ""
  preferred_name: ""           # what you want Superagent to call you in chat
  email: ""
  phone: ""                    # optional; used by some templates (e.g. handoff)
  birth_date: null             # ISO 8601 date; drives age-based defaults & important dates
  timezone: ""                 # IANA tz, e.g. "America/Los_Angeles"
  city: ""
  region: ""                   # state / province
  country: ""
  household_composition: ""    # free text, e.g. "married, two kids (8, 11), one dog, two cats"

preferences:
  # Automation and reminder toggles.
  workspace_path: "workspace"
  autonomous_enabled: true     # if false, every action requires explicit confirmation
  daily_update_auto: true
  weekly_review_auto: true
  monthly_review_auto: true
  terse_mode: false            # concise output for routine operations
  archive_remind: true
  tailor_enabled: true

  # Token economy (see superagent/rules/token-economy.md + rules/subagents.md).
  # Absent block resolves to these same defaults.
  token_economy:
    # Economy level: off | med | full | auto (context-scaled; default).
    level: auto
    # Delegation posture: off | auto | quality | cost (auto follows the
    # resolved economy level).
    subagents: auto
    # Pacing budget — integer, or k/m shorthand ("700k", "1m").
    input_tokens_per_minute: "1m"

  # Cadence schedule (when the cadence skills SHOULD run if you let them).
  cadences:
    daily_update: "08:30"
    weekly_review: "Sunday 18:00"
    monthly_review: "1st 09:00"
    tailor_review: "every 90 days"
    doctor: "every 180 days"

  # Watchlist — change detection for external sources, and the registry of
  # data sources (see contracts/watchlist.md). Absent block = these defaults.
  # Per-watcher settings live in the registry refs, not here.
  watchlist:
    # Registry folder, workspace-relative: one `<name>.ref.md` per watcher (id = stem lowercased).
    # Reserved name inside Sources/; contents are user-editable.
    path: "Sources/Watchlist"
    # Default cadence a watcher is checked on when its ref sets none:
    # daily-update | weekly-review | monthly-review. Cycles nest: a weekly
    # run also checks daily watchers; a monthly run checks all three tiers.
    cycles: [daily-update]
    # Days without a detected change before a watcher is MARKED evicted
    # (never deleted; revive with `watch.status: active`). null = never.
    # Infrastructure feeds (a bank) set null on their own row.
    evict_after_days: 14
    # `cmd` watchers run a shell command from a registry file. Off until you
    # opt in; the agent never flips this without your explicit instruction.
    allow_cmd: false
    # Default throttle: never detect a watcher more often than this many
    # minutes regardless of cycle. null = none (per-row values still apply).
    min_check_interval_minutes: null

  # What hurts most (set during init from the questionnaire).
  pain_points: []              # e.g. ["bills","subscriptions","health-tracking","important-dates"]

  # Money preferences (used by the Bookkeeper persona).
  money:
    currency: "USD"
    budget_method: "zero-based"     # zero-based | 50-30-20 | category | none
    fiscal_year_start_month: 1      # January
    paycheck_cadence: "biweekly"    # weekly | biweekly | semimonthly | monthly | irregular
    low_balance_default: 500        # USD; per-account override in accounts-index.yaml

  # Surfacing windows (where each kind of upcoming thing first crosses your radar).
  surfacing:
    bills_lookahead_days: 7
    appointments_lookahead_days: 14
    important_dates_lookahead_days: 30
    documents_lookahead_days: 60
    maintenance_lookahead_days: 30
    subscription_unused_days: 60     # subscription not used in N days = audit candidate

  # Privacy posture.
  privacy:
    log_user_queries: true           # populate _memory/user-queries.jsonl (used by Supertailor)
    redact_outbound: true            # outbound surfaces go through scrub pipeline

  # Sources library (see contracts/sources.md). `Sources/` holds the user's
  # documents, their optional `<doc>.<ext>.meta.md` sidecars, and the watcher
  # registry `Sources/Watchlist/` (configured under `watchlist:` below). The
  # 0.19.0 fetch cache (`Sources/_cache/`, `cache_*` / chunk / normalize keys)
  # was retired in 0.20.0; leftover keys here are inert.
  sources:
    # When true, the agent treats user-curated content under Sources/ as
    # read-only: it files new documents and writes `.meta.md` sidecars, but
    # never rewrites or moves your files. The `doctor` skill never touches
    # Sources/ in either case.
    user_files_read_only: true
    # Auto-refresh the derived index (`_memory/sources-index.yaml`) on read
    # (mtime-based; cheap when nothing changed).
    auto_refresh_index: true

  # Project surfacing (see contracts/projects.md).
  projects:
    # Lookahead window for project deadlines in daily-update.
    deadline_lookahead_days: 14
    # Days after status: completed before doctor proposes archive.
    archive_after_days: 90
    # Auto-create the next-cycle project when a recurring project completes.
    auto_create_next_cycle: true

  # Events stream (see contracts/events-stream.md / item #16).
  events:
    # Time partitioning. Quarterly default; monthly for high-volume workspaces.
    partition: "quarterly"   # quarterly | monthly | yearly
    # derived | off — partitions are rebuilt from interaction-log + history.md
    # by tools/events_derive.py; per-write mirroring is retired.
    mode: "derived"
    # Event kinds excluded from derivation (rare).
    skip_kinds: []

  # Audit trail (see contracts/audit-trail.md / item #17).
  audit:
    # Master switch. When false, no <file>.history.jsonl is written.
    enabled: true
    # Files to skip auditing (e.g. high-write logs that audit themselves).
    skip_files: ["interaction-log.yaml", "ingestion-log.yaml", "user-queries.jsonl"]
    # Yearly rotate the .history.jsonl files into Archive/.
    rotate_yearly: true

  # Tags (see contracts/tags.md / item #11).
  tags:
    # When the user (or a skill) introduces a new tag, automatically add a
    # row to tags.yaml with placeholder description.
    auto_register: true
    # Validation: refuse to write a tag that doesn't exist in tags.yaml.
    # Default false (lenient); flip true once tags.yaml is curated.
    strict_canonical: false

  # Decisions (see contracts/decisions.md / item #24).
  decisions:
    # Surface decisions made this week in weekly-review.
    surface_in_weekly_review: true
    # Surface decisions whose review_at <= now in monthly-review.
    surface_in_monthly_review: true

  # Sensitive tier (see contracts/sensitive-tier.md / item #18).
  sensitive:
    # Master switch.
    enabled: true
    # Where the sensitive sub-tree lives. Default: in-workspace.
    # Override to point at an encrypted disk image / external mount:
    #   path: "/Volumes/SuperagentVault/_memory/sensitive"
    path: null              # null = workspace/_memory/sensitive
    # Files intended for the sensitive tier (additive to per-row sensitive flag).
    # Routing is NOT yet enforced: these files stay at `_memory/` top level
    # unless the user relocates them; see contracts/sensitive-tier.md.
    auto_route_files:
      - "health-records.yaml"
      - "accounts-index.yaml"

  # Visibility (see contracts/visibility.md / item #19).
  visibility:
    # Default visibility for newly-created entities.
    default: "private"      # private | household | public
    # When the workspace is shared (household mode), this is the household name.
    household_name: ""

  # Operational handles (see contracts/operational-handles.md / item #20).
  handles:
    # Master switch — when true, every new entity gets a `handle` field
    # populated as `<kind>:<id>`. Existing entities are backfilled by
    # `tools/world.py rebuild`.
    enabled: true

  # Outbox lifecycle (see contracts/outbox-lifecycle.md / item #13).
  outbox:
    # Conventional lifecycle sub-folders. NOT auto-created at init —
    # materialized lazily on first write per
    # `contracts/outbox-lifecycle.md` § "Lazy sub-directory creation".
    lifecycle_stages: ["drafts", "staging", "sent", "sealed"]
    # Max age (days) before stage:drafts artifacts are surfaced as stale.
    drafts_stale_days: 14

  # Workbook projections (see superagent/tools/render_workbooks.py).
  # Per-domain (and optional per-entity) `.xlsx` views of the structured
  # YAML data, regenerated lazily — only when ≥1 row of data exists for a
  # given workbook AND the underlying source files have changed since the
  # last render. Source-of-truth stays in YAML / markdown; xlsx is a
  # human-friendly read-only projection (the agent never reads it back).
  workbooks:
    # Master switch for the whole subsystem.
    enabled: true
    # How far back the time-series sheets (transactions, vet visits,
    # service history, etc.) reach. Set during init via the workbook
    # history-window question. 10 years covers most personal-tax /
    # net-worth use-cases.
    history_window_years: 10
    # Privacy scan posture for cell values:
    #   strict — refuse any cell matching SSN / full account # / full card # /
    #            high-entropy secret patterns; cell becomes "[REDACTED]".
    #   lenient — only redact obvious SSN / 16-digit numerics.
    #   off    — no scan (NOT recommended; xlsx files leak easily).
    privacy_scan: strict
    # When true, also render per-entity workbooks (per pet, per vehicle,
    # per asset) alongside the per-domain workbook. Per-entity workbooks
    # are themselves lazy — they materialize only when the entity has
    # accumulated meaningful event-history (≥5 events, or ≥2 lots).
    per_entity: true
    # Sensitivity overrides — both default to opt-in (false) because the
    # workbooks aggregate data that's easy to over-share by accident.
    health:
      # Flip to true to enable rendering Domains/Health/health.xlsx.
      enabled: false
    business:
      # Flip to true to enable rendering Domains/Business/business.xlsx.
      enabled: false

  # Inbox triage (see contracts/inbox-triage.md / item #5).
  inbox_triage:
    # Days before files in Inbox/ surface as stale to triage.
    stale_days: 14
    # Pre-classify by extension before asking the user.
    auto_classify: true

  # Anti-pattern scanner (superagent/docs/_internal/perf-improvement-ideas.md § "Anti-patterns").
  anti_patterns:
    # When true, doctor / supertailor-review run the anti-pattern scanner over
    # skills/*.md and surface findings.
    scan_skills: true

# --- Data sources (which MCPs / CLI tools you've authorized) ---
# This block carries the COARSE flag (have you set up the auth at all?). The detailed
# per-source configuration lives in the watchlist registry (one
# `Sources/Watchlist/<name>.ref.md` per source, id = stem lowercased; see contracts/watchlist.md) and its run
# state in `_memory/watchlist-state.yaml`.
#
# init() flips an entry from `false` to `true` after a successful health check.
data_sources_configured:
  # Only sources with a shipped watcher pack are listed. Any other source is a
  # pack you author or install under `workspace/_custom/watchers/<id>/` plus one
  # `Sources/Watchlist/<name>.ref.md` (id = stem lowercased); `watch enable <pack>` adds its flag row here.
  email:
    gmail: false                 # Gmail MCP authorized (the `gmail` pack reuses its token)
  finance:
    simplefin: false             # SimpleFIN Bridge (shipped; see docs/data-sources.md § simplefin)
    csv_only: false              # generic bank CSV import (`tools/ingest/csv.py --file`)

