# [Do not change manually — managed by Superagent]
# Superagent memory: the asks queue — what waits on the owner's call
# (contracts/autonomy.md § 7).
#
# A run with nobody present never asks a question in chat. It writes the
# question here and carries on. The briefing shows the open rows under
# "Waiting on your call", and the owner's answer is recorded on the row, where
# the agent that asked finds it at its next run.
#
# An ask is not an approval: it records that a decision is wanted. An approval
# of an outward action is asked for at the moment of action and covers that
# one action (contracts/autonomy.md § 4).
#
# One writer: `uv run python -m superagent.tools.asks` (`add`, `list --open`,
# `answer`, `expire`). Time-shape (contracts/memory-taxonomy.md): rows are
# appended and never deleted; an existing row changes only its `status`,
# `answer`, `closed_at`, `closed_by` and `notes`.

schema_version: 1
last_updated: null

asks:
  # Each ask:
  #   id          — "ask-YYYY-MM-DD-<machine>-NNN", minted by `asks add`.
  #   asked_at    — ISO 8601 datetime the ask was written.
  #   agent       — Who asks: an agent's instance name ("updater", "bookkeeper",
  #                  "superagent", "project:<slug>").
  #   question    — One line the owner can answer.
  #   context     — What the owner needs to know to answer; null when the
  #                  question says it all.
  #   options     — Suggested answers, shortest first; may be empty.
  #   tier        — What the answer unlocks (contracts/autonomy.md § 1):
  #                  approve  the agent then carries the action out
  #                  prepare  the agent prepares, the owner does the last step
  #                  owner    the decision and the action are the owner's
  #   key         — Optional. One open ask per key: adding an ask whose key
  #                  matches an open one adds nothing, so a finding that
  #                  repeats every cycle asks once.
  #   related     — Operational handles the ask is about ("watch:simplefin",
  #                  "project:kitchen-reno-2026", "task:20260428-001").
  #   expires_at  — ISO 8601 datetime; null = it waits until answered. Past it,
  #                  `asks expire` closes the row, and that counts as no answer.
  #   status      — open | answered | expired | withdrawn
  #   answer      — The owner's answer; for `withdrawn`, why it is no longer needed.
  #   closed_at   — ISO 8601 datetime the row left `open`.
  #   closed_by   — "owner", the agent that withdrew it, or "expiry".
  #   notes       — Free-form context.
  - id: ""
    asked_at: null
    agent: ""
    question: ""
    context: null
    options: []
    tier: "approve"
    key: null
    related: []
    expires_at: null
    status: "open"
    answer: null
    closed_at: null
    closed_by: null
    notes: null
