# [Do not change manually — managed by Superagent]
# Superagent memory: framework-improvement suggestions from the `supertailor-review`
# skill, tracked through their lifecycle.
# New suggestions are appended; status is updated in place.

schema_version: 1
last_updated: null

suggestions:
  # Each suggestion:
  #   id                    — Unique ID: "st-YYYY-MM-DD-<machine>-NNN", minted with
  #                            `uv run python -m superagent.tools.next_id --kind st --file <this file>`
  #                            (older ids "st-YYYY-MM-DD-NNN" stay valid).
  #   proposed_at           — ISO 8601 when suggested.
  #   category              — new-skill | skill-improvement | memory-schema |
  #                            template | workflow | hygiene | config |
  #                            new-ingestor | auto-capture-rule | surfacing-rule
  #   destination           — superagent | _custom (see skills/supertailor-review.md
  #                            § 4 "Destination and agent classification").
  #                            superagent → generic; built into the committed
  #                            framework tree.
  #                            _custom      → user-specific; built into
  #                            workspace/_custom/.
  #                            The review defaults to _custom for anything naming
  #                            specific people, addresses, accounts, assets. A
  #                            suggestion whose destination is superagent but whose
  #                            body carries workspace-specific content is REFUSED at
  #                            the write (rules/framework-changes.md § 2).
  #   agent                 — Role name of the agent the suggestion concerns
  #                            (contracts/agents.md); the dev twin of that agent
  #                            builds it. Empty or absent = the lead.
  #   priority              — high | medium | low
  #   title                 — Short descriptive title.
  #   problem               — What friction or gap was observed.
  #   evidence              — Specific data points from logs, transcripts, workspace.
  #   suggestion            — Concrete proposed change.
  #   implementation_sketch — Brief outline of what will be implemented and where
  #                            (full file paths).
  #   effort                — small | medium | large
  #   risk                  — Migration concerns or breakage potential.
  #   status                — proposed | approved | declined | implemented | deferred
  #   resolved_at           — ISO 8601 when resolved, or null.
  #   implementation_notes  — Notes after implementation (which dev twin built it;
  #                            files created or modified; safeguard re-routes; commit
  #                            SHA, or "(workspace)" for a _custom change), or null.
  - id: null
    proposed_at: null
    category: ""
    destination: ""
    agent: ""
    priority: ""
    title: ""
    problem: ""
    evidence: ""
    suggestion: ""
    implementation_sketch: ""
    effort: ""
    risk: ""
    status: "proposed"
    resolved_at: null
    implementation_notes: null
