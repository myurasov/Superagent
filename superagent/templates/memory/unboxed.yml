# [Do not change manually — managed by Superagent]
# Superagent memory: registry of pass-through wrappers for name-blocked
# commands.
#
# Implements: superagent/rules/unbox.md.
#
# Some harnesses deny commands by name (not by sandbox policy). The fix is a
# wrapper in ~/.superagent/tmp/bin/ that execs the real binary; this file is
# the durable cross-session record of those wrappers. Read once per session
# (AGENTS.md "Non-Negotiables" floor item 1). Entity-shape: mutate rows in
# place; one row per wrapper.
wrappers: []
