# [Do not change manually — managed by Superagent]
# Superagent memory: append-only archive of resolved context.yaml entries.
# Rows move here VERBATIM when removed from context.yaml (alerts resolved,
# recent_activity trimmed past the newest ~8, current_focus superseded).
# New entries go at the end; do NOT rewrite history.

schema_version: 1

archived:
  # Each entry:
  #   archived_at — ISO 8601 when the row was moved out of context.yaml.
  #   kind        — alert | pending_item | recent_activity | current_focus_prior.
  #   text        — The removed entry, verbatim.
  # Example:
  # - archived_at: "2026-08-31T09:00:00-07:00"
  #   kind: alert
  #   text: "PG&E bill overdue since 08-25 — resolved: paid 08-30."
  []
