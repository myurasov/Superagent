# [Do not change manually - generated by tools/build_agent_manifest.py]
#
# The roster of agent roles under `superagent/agents/` (contracts/agents.md).
# One row per `<name>.agent.md`, taken from its frontmatter. Regenerate after
# any change to a role file:
#   uv run python -m superagent.tools.build_agent_manifest
schema_version: 1
role_count: 4
roles:
- name: superagent
  kind: lead
  origin: framework
  path: superagent/agents/superagent.agent.md
  dev_twin: superagent/agents/superagent.agent.dev.md
  description: 'The lead agent and the owner''s single point of contact: runs the briefings and the reviews,
    hands work to the other agents, and carries the physical-state and storage-hygiene duties.'
  skills: all
  owns:
  - _memory/context.yaml
  - _memory/model-context.yaml
  - _memory/todo.yaml
  - _memory/agents.yaml
  authority: act
  model_tier: runner
  duties:
  - id: daily-update
    skill: daily-update
    tier: act
    schedule: daily_update
    check: cadence
  - id: weekly-review
    skill: weekly-review
    tier: act
    schedule: weekly_review
    check: cadence
  - id: monthly-review
    skill: monthly-review
    tier: act
    schedule: monthly_review
    check: cadence
  - id: supertailor-review
    skill: supertailor-review
    tier: approve
    schedule: tailor_review
    check: cadence
  - id: doctor
    skill: doctor
    tier: approve
    schedule: doctor
    check: cadence
- name: bookkeeper
  kind: durable
  origin: framework
  path: superagent/agents/bookkeeper.agent.md
  dev_twin: superagent/agents/bookkeeper.agent.dev.md
  description: 'The money side of the house: bills, subscriptions, spending, the monthly close and the
    tax packet. It reconciles and flags. It never pays and never cancels.'
  skills:
  - bills
  - subscriptions
  - expenses
  owns:
  - _memory/bills.yaml
  - _memory/subscriptions.yaml
  authority: act
  model_tier: runner
  duties:
  - id: bills
    skill: bills
    tier: act
    schedule: on-request
    check: none
  - id: subscriptions
    skill: subscriptions
    tier: act
    schedule: on-request
    check: none
  - id: expenses
    skill: expenses
    tier: act
    schedule: on-request
    check: none
- name: project
  kind: project
  origin: framework
  path: superagent/agents/project.agent.md
  dev_twin: superagent/agents/project.agent.dev.md
  description: 'One agent for one Project: keeps its charter, status, history and sources current and
    does the project''s research and drafting. It stays idle until someone writes to it.'
  skills:
  - projects
  - todo
  - research
  - report
  - draft-email
  - summarize-thread
  - add-source
  - sources
  - add-contact
  - log-event
  owns:
  - Projects/<slug>/
  authority: act
  model_tier: runner
  duties: []
- name: updater
  kind: durable
  origin: framework
  path: superagent/agents/updater.agent.md
  dev_twin: superagent/agents/updater.agent.dev.md
  description: 'The update loop: checks the watched sources, harvests where a handler exists, captures
    and reconciles what moved, and reports what it found. It never asks and never sends.'
  skills:
  - watch
  - sources
  - add-source
  owns:
  - _memory/watchlist-state.yaml
  - _memory/ingestion-log.yaml
  authority: act
  model_tier: runner
  duties:
  - id: watchlist
    skill: watch
    tier: act
    schedule: watchlist
    check: watchers
